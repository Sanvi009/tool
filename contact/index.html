<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ToolHub</title>
    <style>
        /* RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #ffffff;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* TOP BAR */
        .top-bar {
            width: 100%;
            height: 70px;
            background-color: #e2e8f0;
            border-bottom: 1px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* LOGO AREA */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #1f2937, #374151);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        /* NAVIGATION ICONS */
        .nav-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .nav-icon:hover {
            background-color: #f3f4f6;
            color: #3b82f6;
        }

        /* CONTENT AREA */
        .content-area {
            flex: 1;
            padding: 40px 28px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .content-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .content-title {
            font-size: 36px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 12px;
        }

        .content-subtitle {
            font-size: 18px;
            color: #6b7280;
            line-height: 1.6;
        }

        /* FOOTER */
        .footer {
            height: 60px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 14px;
            background-color: #f9fafb;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .top-bar {
                height: 56px;
                padding: 0 16px;
            }

            .content-area {
                padding: 30px 16px;
            }

            .content-title {
                font-size: 28px;
            }

            .content-subtitle {
                font-size: 16px;
            }

            .nav-icons {
                gap: 15px;
            }

            .nav-icon {
                width: 32px;
                height: 32px;
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .logo-text {
                font-size: 18px;
            }

            .logo-icon {
                width: 28px;
                height: 28px;
                font-size: 16px;
            }

            .content-title {
                font-size: 24px;
            }

            .nav-icons {
                gap: 12px;
            }

            .nav-icon {
                width: 28px;
                height: 28px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- TOP BAR WITH LOGO AND NAV ICONS -->
    <header class="top-bar">
        <div class="logo-container">
            <div class="logo-icon">T</div>
            <a href="/" class="logo-text">ToolHub</a>
        </div>

        <div class="nav-icons">
            <a href="/term/" class="nav-icon" title="Terms & Conditions">📜</a>
            <a href="/privacy/" class="nav-icon" title="Privacy Policy">🔒</a>
            <a href="/contact/" class="nav-icon" title="Contact" style="color: #3b82f6;">📧</a>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="content-area">
        <div class="content-header">
            <h1 class="content-title">Contact Us</h1>
            <p class="content-subtitle">Get in touch with the ToolHub team</p>
        </div>

        <!-- CONTENT WILL BE ADDED HERE LATER -->
        <div style="text-align: center; padding: 60px 0; color: #9ca3af;">
            <div style="font-size: 48px; margin-bottom: 20px;">📧</div>
            <h3 style="color: #6b7280; margin-bottom: 10px;">Contact Page</h3>
            <p>Content coming soon...</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <span>© 2024 ToolHub. All tools belong to their respective owners.</span>
    </footer>
</body>
</html>
